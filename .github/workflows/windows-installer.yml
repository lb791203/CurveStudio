name: Windows Installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-installers:
    name: Build and verify Windows installers
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ctv-macos-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install npm dependencies
        run: npm install

      - name: Read package version
        run: |
          $version = node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version"
          "CURVESTUDIO_VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ctv-macos-mvp/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ctv-macos-mvp/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Release audit
        run: npm run audit:release

      - name: Run tests
        run: npm test

      - name: Validate import fixtures
        run: npm run validate:fixtures

      - name: Build frontend dist
        run: npm run build:dist

      - name: Clean stale installer bundles
        run: |
          Remove-Item -Recurse -Force src-tauri/target/release/bundle/nsis -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force src-tauri/target/release/bundle/msi -ErrorAction SilentlyContinue

      - name: Build Windows installers
        run: npm run tauri:build:windows

      - name: Verify installer artifacts
        run: npm run verify:windows-artifacts

      - name: Verify bundled resources (whitelist)
        run: |
          npm run verify:bundle
          node scripts/verify-bundle.mjs --binary src-tauri/target/release/curvestudio.exe

      - name: Verify contents of the final installers
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/CurveStudio_${env:CURVESTUDIO_VERSION}_*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/CurveStudio_${env:CURVESTUDIO_VERSION}_*.msi" | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw "installer not found" }
          $nsisDir = Join-Path $env:RUNNER_TEMP "nsis-unpacked"
          $msiDir = Join-Path $env:RUNNER_TEMP "msi-unpacked"
          & 7z x $nsis.FullName "-o$nsisDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack $($nsis.Name)" }
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$msiDir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed for $($msi.Name): $($p.ExitCode)" }
          node scripts/verify-bundle.mjs --binary $nsisDir
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer content check failed" }
          node scripts/verify-bundle.mjs --binary $msiDir
          if ($LASTEXITCODE -ne 0) { throw "MSI installer content check failed" }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: CurveStudio-windows-installers
          path: |
            ctv-macos-mvp/src-tauri/target/release/bundle/nsis/CurveStudio_${{ env.CURVESTUDIO_VERSION }}_*.exe
            ctv-macos-mvp/src-tauri/target/release/bundle/msi/CurveStudio_${{ env.CURVESTUDIO_VERSION }}_*.msi
          if-no-files-found: error
